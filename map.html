<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南水北调工程线路图</title>
    <!-- 1. 引入地图核心依赖 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 2. 确保body占满全屏，消除外边距 */
            margin: 0;
            padding: 0;
            height: 100vh; /* 关键：全屏高度 */
            display: flex;
            flex-direction: column;
        }
        /* 3. 地图容器关键样式：必须有明确高度 */
        #map {
            flex: 1; /* 关键：占据剩余所有空间 */
            width: 100%;
            background-color: #000; /* 备用背景色 */
        }
        .legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .color-box {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <!-- 4. 图例区域 -->
    <div class="legend">
        <div class="legend-item">
            <div class="color-box" style="background-color: #28a745;"></div>
            <span>东线工程</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: #fd7e14;"></div>
            <span>中线工程</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background-color: #dc3545;"></div>
            <span>西线工程</span>
        </div>
    </div>
    
    <!-- 5. 地图容器 -->
    <div id="map"></div>

    <script>
        // 6. 确保DOM加载完成后再初始化地图
        document.addEventListener('DOMContentLoaded', function() {
            // 中心点设为南水北调中线核心区域（南阳/北京之间）
            var map = L.map('map').setView([35, 110], 5);

            // 在线瓦片
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // 工程线路数据（简化版）
            const eastRoute = [[32.39, 119.45], [39.90, 116.40]]; // 扬州 -> 北京
            const midRoute = [[33.05, 111.62], [39.90, 116.40]]; // 丹江口 -> 北京
            const westRoute = [[30.00, 92.00], [35.00, 104.00]]; // 示意

            // 绘制线路
            L.polyline(eastRoute, {color: '#28a745', weight: 5, opacity: 0.8}).addTo(map);
            L.polyline(midRoute, {color: '#fd7e14', weight: 5, opacity: 0.8}).addTo(map);
            L.polyline(westRoute, {color: '#dc3545', weight: 5, opacity: 0.8, dashArray: '10, 10'}).addTo(map);

            // 标记重要节点
            L.marker([33.05, 111.62]).addTo(map) // 丹江口
                .bindPopup('<b>丹江口水库</b><br>中线工程起点');
            L.marker([39.90, 116.40]).addTo(map) // 北京
                .bindPopup('<b>北京市</b><br>南水北调受水区');
        });
    </script>
</body>
</html>
