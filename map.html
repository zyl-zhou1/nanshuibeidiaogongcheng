<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南水北调地理地图</title>
    <!-- 在线引入Leaflet地图依赖（彻底解决本地依赖问题） -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 地图容器全屏显示 */
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <!-- 地图容器 -->
    <div id="map"></div>

    <script>
        // 初始化地图：中心点设为南阳（淅川/邓州）
        var map = L.map('map').setView([32.85, 111.55], 7);

        // 在线地图瓦片（无本地资源，GitHub绝对可用）
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | 南水北调双卷文旅项目'
        }).addTo(map);

        // 标注核心点位：淅川（丹江口水库）
        L.marker([32.75, 111.43]).addTo(map)
            .bindPopup('<b>淅川县</b><br>丹江口水库·保水质核心区')
            .openPopup();

        // 标注核心点位：邓州（陶岔渠首）
        L.marker([32.65, 111.70]).addTo(map)
            .bindPopup('<b>邓州市</b><br>南水北调陶岔渠首');

        // 标注核心点位：北京
        L.marker([39.90, 116.40]).addTo(map)
            .bindPopup('<b>北京市</b><br>南水北调受水区');

        // 绘制南水北调连线（视觉效果）
        var points = [
            [32.65, 111.70],
            [39.90, 116.40]
        ];
        L.polyline(points, {color: '#0066cc', weight: 3}).addTo(map);
    </script>
</body>
</html>
